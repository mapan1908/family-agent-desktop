name: Release

# 触发条件：推送 v* tag（如 v0.1.0、v1.0.0）
# 手动触发也可以（workflow_dispatch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 防止多个 release 并行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 准备工作：lint + 测试 ──
  prepare:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node --check index.js
      - run: node --check agent/core.js
      - run: node --check api/paths.js

  # ── 三平台并行 build ──
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            os: macos-13
            target: node22-macos-x64
            tauri_target: ''
            artifact: 'Family Agent_x64.app.tar.gz'
          - platform: macos-arm64
            os: macos-14
            target: node22-macos-arm64
            tauri_target: 'aarch64-apple-darwin'
            artifact: 'Family Agent_aarch64.app.tar.gz'
          - platform: windows-x64
            os: windows-latest
            target: node22-win-x64
            tauri_target: 'x86_64-pc-windows-msvc'
            artifact: 'Family Agent_x64-setup.exe'
          - platform: linux-x64
            os: ubuntu-22.04
            target: node22-linux-x64
            tauri_target: 'x86_64-unknown-linux-gnu'
            artifact: 'family-agent_x64.AppImage'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── 装 npm 依赖（不含 native module，由 pkg 在 build 阶段编译）──
      - run: npm ci --ignore-scripts
        shell: bash

      # ── 用 pkg 打 Node.js binary ──
      - name: Build Node.js backend (pkg)
        run: npx @yao-pkg/pkg . --targets ${{ matrix.target }} --out-path src-tauri/binaries
        shell: bash

      # ── 重命名 binary（pkg 不会自动加 .exe）──
      - name: Rename backend binary
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv src-tauri/binaries/family-agent src-tauri/binaries/family-agent-backend.exe 2>/dev/null || \
            mv src-tauri/binaries/index.js src-tauri/binaries/family-agent-backend.exe 2>/dev/null || true
          else
            mv src-tauri/binaries/family-agent src-tauri/binaries/family-agent-backend 2>/dev/null || \
            mv src-tauri/binaries/index.js src-tauri/binaries/family-agent-backend 2>/dev/null || true
          fi
          ls -la src-tauri/binaries/
        shell: bash

      # ── Linux 额外装 webkit2gtk（Tauri Linux 依赖）──
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Tauri build ──
      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Family Agent ${{ github.ref_name }}'
          releaseBody: '自动 build 的桌面安装包'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.tauri_target }}

      # ── 上传 artifact ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-agent-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 14
